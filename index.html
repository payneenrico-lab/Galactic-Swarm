<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Galactic Swarm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05050a">
<style>
  html, body { margin: 0; height: 100%; background: #05050a; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { height: min(100vh, 100vw * 288 / 224); height: min(100dvh, 100vw * 288 / 224);
           aspect-ratio: 224 / 288; background: #000; image-rendering: pixelated; box-shadow: 0 0 40px #1a1a4a; }
  #pad { display: none; position: fixed; left: 0; right: 0; bottom: 0; box-sizing: border-box;
         padding: 0 calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
         justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #pad .grp { display: flex; gap: 14px; align-items: flex-end; }
  #pad button { pointer-events: auto; touch-action: none; font: bold 15px/1 "Courier New", monospace; color: #fff;
         background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.45); border-radius: 50%;
         width: 84px; height: 84px; padding: 0; }
  #pad button.on { background: rgba(255,255,255,.4); }
  #pad #fire { width: 104px; height: 104px; border-color: #ffe14d; color: #ffe14d; }
  #pad .sm { width: 46px; height: 46px; font-size: 11px; border-radius: 10px; }
  #slide { pointer-events: auto; touch-action: none; position: relative; width: 182px; height: 84px;
         background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.45); border-radius: 42px; }
  #slide::before, #slide::after { content: ''; position: absolute; top: 50%; transform: translateY(-50%);
         border: 7px solid transparent; }
  #slide::before { left: 16px; border-right-color: rgba(255,255,255,.5); }
  #slide::after { right: 16px; border-left-color: rgba(255,255,255,.5); }
  #slideThumb { position: absolute; top: 4px; left: 4px; width: 76px; height: 76px; border-radius: 50%;
         background: rgba(255,255,255,.4); pointer-events: none; }
  #mid { display: flex; flex-direction: column; gap: 10px; }
  @media (pointer: coarse) { #pad { display: flex; } }
  /* Landscape: game fills the height, controls sit on the side gutters, pause/mute tucked in the top-right. */
  @media (orientation: landscape) {
    #mid { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right)); flex-direction: row; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad">
  <div class="grp"><div id="slide"><i id="slideThumb"></i></div></div>
  <div id="mid"><button id="bp" class="sm">PAUSE</button><button id="bm" class="sm">MUTE</button></div>
  <div class="grp"><button id="fire">FIRE</button></div>
</div>
<script>
"use strict";
// ================================================================ setup
const W = 224, H = 288, S = 3;
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const PLAYER_Y = 254, TOP = 24;
const TOUCH = matchMedia('(pointer: coarse)').matches;
const rnd = Math.random;

// ================================================================ sprites (original artwork)
function mk(rows, pal) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) { const col = pal[r[i]]; if (col) { x.fillStyle = col; x.fillRect(i, y, 1, 1); } } });
  return c;
}
const BEE = [[
"....Y...Y....", ".....YYY.....", "BB..YYYYY..BB", "BBB.YRYRY.BBB", "BBBBYYYYYBBBB", ".BBB.YYY.BBB.", "..BB.YYY.BB..", "...B.Y.Y.B...", "......Y.Y...."],[
"....Y...Y....", ".....YYY.....", "....YYYYY....", "BB..YRYRY..BB", "BBB.YYYYY.BBB", "BBBBYYYYYBBBB", ".BBB.YYY.BBB.", "..BB.Y.Y.BB..", "......Y.Y...."]];
const MOTH = [[
"..R.......R..", ".RRR.WWW.RRR.", "RRRRRWWWRRRRR", "RRWRRWBWRRWRR", "RRRRRWWWRRRRR", ".RRR.WBW.RRR.", "..R..WWW..R..", ".....W.W....."],[
"..R.......R..", "..RR.WWW.RR..", ".RRRRWWWRRRR.", "RRRWRWBWRWRRR", "RRRRRWWWRRRRR", "..RR.WBW.RR..", "..R..WWW..R..", ".....W.W....."]];
const BOSS = [[
".O.........O.", ".OO..GGG..OO.", "..OOGGGGGOO..", ".GGGGYGYGGGG.", "GGGGGGGGGGGGG", "GG.GGGGGGG.GG", "G..GGGGGGG..G", "...GG...GG...", "..G.......G.."],[
".O.........O.", ".OO..GGG..OO.", "..OOGGGGGOO..", ".GGGGYGYGGGG.", "GGGGGGGGGGGGG", ".G.GGGGGGG.G.", "...GGGGGGG...", "..GG.....GG..", ".G.........G."]];
const SHIP = [
"......W......", "......W......", ".....WWW.....", ".....WBW.....", "..W..WWW..W..", "..W.WWWWW.W..", ".WW.WWWWW.WW.", "WWWWWWRWWWWWW", "WWWWWWWWWWWWW", "WW.WWWWWWW.WW", "R..WW.R.WW..R"];

const PAL_BEE  = { Y: '#ffe14d', B: '#3d7bff', R: '#ff3b3b' };
const PAL_MOTH = { R: '#ff4d4d', W: '#ffffff', B: '#3d7bff' };
const PAL_BOSS = { G: '#33e07a', O: '#ff9a1f', Y: '#ffe14d' };
const PAL_BOSS_HURT = { G: '#b06bff', O: '#ff9a1f', Y: '#ffe14d' };
const IMG = {
  bee:  BEE.map(f => mk(f, PAL_BEE)),
  moth: MOTH.map(f => mk(f, PAL_MOTH)),
  boss: BOSS.map(f => mk(f, PAL_BOSS)),
  bossHurt: BOSS.map(f => mk(f, PAL_BOSS_HURT)),
  ship: mk(SHIP, { W: '#e8ecff', B: '#3fd8ff', R: '#ff3b3b' }),
  shipRed: mk(SHIP, { W: '#ff6a6a', B: '#ffd0d0', R: '#ffffff' }),
};
const KIND_IMG = [IMG.bee, IMG.moth, IMG.boss];
const PTS_FORM = [50, 80, 150], PTS_DIVE = [100, 160, 400];

// ================================================================ audio
let ac = null, master = null, noiseBuf = null, muted = false, beamSnd = null;
function initAudio() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.35; master.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1;
}
function tone(o) {
  if (!ac) return;
  const t = ac.currentTime + (o.delay || 0), dur = o.dur;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(o.f0, t);
  if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  g.gain.setValueAtTime(o.vol ?? 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(master);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function noise(o) {
  if (!ac) return;
  const t = ac.currentTime + (o.delay || 0), dur = o.dur;
  const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = ac.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(o.f0, t); f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(o.vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t, rnd()); src.stop(t + dur + 0.02);
}
const arp = (fs, step, type = 'square', vol = 0.22, dur = 0.12) => fs.forEach((f, i) => tone({ type, f0: f, f1: f * 1.002, dur, vol, delay: i * step }));
const sfx = {
  shoot()  { tone({ f0: 1500, f1: 300, dur: 0.09, vol: 0.16 }); },
  hit()    { tone({ f0: 700, f1: 120, dur: 0.14, vol: 0.28 }); noise({ dur: 0.12, vol: 0.25, f0: 5000, f1: 500 }); },
  bossHit(){ tone({ type: 'sawtooth', f0: 300, f1: 200, dur: 0.12, vol: 0.28 }); tone({ f0: 900, f1: 600, dur: 0.06, vol: 0.2 }); },
  bossDie(){ tone({ type: 'sawtooth', f0: 500, f1: 60, dur: 0.35, vol: 0.3 }); noise({ dur: 0.35, vol: 0.4, f0: 5000, f1: 200 }); },
  dive()   { tone({ type: 'sawtooth', f0: 900, f1: 250, dur: 0.28, vol: 0.09 }); },
  enemyShot() { tone({ type: 'square', f0: 480, f1: 200, dur: 0.1, vol: 0.1 }); },
  playerDie() { noise({ dur: 1.1, vol: 0.7, f0: 4000, f1: 60 }); tone({ type: 'sawtooth', f0: 260, f1: 30, dur: 1.0, vol: 0.25 }); },
  capture()   { for (let i = 0; i < 10; i++) tone({ type: 'triangle', f0: 900 - i * 60, f1: 500 - i * 30, dur: 0.1, vol: 0.25, delay: i * 0.08 }); },
  rescue()    { arp([392, 523, 659, 784, 1047, 1319], 0.07, 'square', 0.2, 0.12); },
  extra()     { arp([523, 659, 784, 1047], 0.1, 'triangle', 0.35, 0.14); },
  stage()     { arp([330, 392, 494, 659, 494, 659, 784], 0.09, 'square', 0.18, 0.1); },
  challenge() { arp([262, 330, 262, 392, 330, 494, 392, 523], 0.08, 'triangle', 0.3, 0.1); },
  perfect()   { arp([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.08, 'square', 0.2, 0.12); },
  over()      { arp([392, 330, 262, 196], 0.25, 'triangle', 0.35, 0.3); },
};
function beamStart() {
  if (!ac || beamSnd) return;
  const osc = ac.createOscillator(), lfo = ac.createOscillator(), lg = ac.createGain(), g = ac.createGain();
  osc.type = 'triangle'; osc.frequency.value = 420;
  lfo.frequency.value = 11; lg.gain.value = 150;
  g.gain.value = 0.12;
  lfo.connect(lg); lg.connect(osc.frequency);
  osc.connect(g); g.connect(master);
  osc.start(); lfo.start();
  beamSnd = { osc, lfo };
}
function beamStop() {
  if (!beamSnd) return;
  try { beamSnd.osc.stop(); beamSnd.lfo.stop(); } catch (e) {}
  beamSnd = null;
}

// ================================================================ input
const keys = {};
let firePressed = false;
function togglePause() {
  if (st !== 'play' && st !== 'intro') return;
  paused = !paused;
  if (paused) beamStop(); else if (enemies.some(e => e.state === 'beam' && e.beamOn)) beamStart();
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.35; }
function pressFire() {
  initAudio();
  if (st === 'title' || st === 'over') startGame(); else firePressed = true;
}
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  keys[k] = true; initAudio();
  if (k === ' ' || k === 'enter') pressFire();
  if (k === 'm') toggleMute();
  if (k === 'p') togglePause();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ================================================================ paths
function buildPath(ctrl) {
  const P = [ctrl[0], ...ctrl, ctrl[ctrl.length - 1]], pts = [];
  for (let i = 0; i < P.length - 3; i++) {
    const [p0, p1, p2, p3] = [P[i], P[i + 1], P[i + 2], P[i + 3]];
    for (let k = 0; k < 10; k++) {
      const t = k / 10, t2 = t * t, t3 = t2 * t;
      const f = j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      pts.push([f(0), f(1)]);
    }
  }
  pts.push(ctrl[ctrl.length - 1]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function posAt(p, d) {
  const c = p.cum; d = Math.min(d, p.len);
  let lo = 0, hi = c.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (c[m] <= d) lo = m; else hi = m; }
  const seg = c[hi] - c[lo] || 1, t = (d - c[lo]) / seg, a = p.pts[lo], b = p.pts[hi];
  return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
const mirror = pts => pts.map(([x, y]) => [W - x, y]);
const NL = [[-16, 236], [36, 218], [90, 180], [124, 130], [108, 90], [86, 110], [96, 140]];
const NT = [[112, -16], [112, 60], [150, 110], [112, 150], [76, 110], [96, 80]];
const CP1 = [[60, -16], [70, 80], [150, 130], [170, 190], [110, 220], [70, 180], [100, 130], [150, 90], [240, 60]];
const CP3 = [[-16, 200], [80, 190], [160, 150], [150, 90], [100, 90], [100, 140], [150, 200], [200, 290]];
const CP5 = [[112, -16], [112, 100], [60, 160], [110, 210], [170, 160], [112, 110], [112, 200], [112, 300]];
const ENTRY_PATHS = [NL, mirror(NL), NL, mirror(NL), NT].map(buildPath);
const CHALLENGE_PATHS = [CP1, mirror(CP1), CP3, mirror(CP3), CP5].map(buildPath);

// ================================================================ state
let st = 'title', paused = false, frame = 0, timer = 0;
let score = 0, hi = 0, reserve = 2, stage = 1, nextExtra = 20000;
let enemies = [], pBullets = [], aBullets = [], explosions = [], popups = [], rescue = null;
let entryDone = false, challenge = false, challengeHits = 0, challengeBonus = 0, diveTimer = 0, fireCd = 0;
let stars = [];
const player = { x: 112, dual: false, inv: 0, state: 'ok', t: 0, boss: null, sx: 0, sy: 0 };
try { hi = +localStorage.getItem('gs_hi') || 0; } catch (e) {}
for (let i = 0; i < 70; i++) stars.push({ x: rnd() * W, y: rnd() * H, v: 0.3 + rnd() * 1.4, c: ['#fff', '#7fb0ff', '#ff9a9a'][i % 3] });

const slotX = c => 112 + (c - 4.5) * 16;
function slotPos(e) {
  const b = entryDone ? 1 + 0.07 * Math.sin(frame * 0.03) : 1, sway = Math.sin(frame * 0.015) * 16;
  return { x: 112 + (e.c - 4.5) * 16 * b + sway, y: 46 + e.r * 15 };
}

function startGame() {
  score = 0; reserve = 2; stage = 1; nextExtra = 20000; paused = false;
  player.dual = false; beginStage();
}
function beginStage() {
  challenge = stage % 4 === 3;
  st = 'intro'; timer = 110;
  enemies = []; pBullets = []; aBullets = []; explosions = []; popups = []; rescue = null;
  entryDone = false; challengeHits = 0; diveTimer = 120;
  resetPlayer();
  (challenge ? sfx.challenge : sfx.stage)();
}
function resetPlayer() {
  player.x = 112; player.state = 'ok'; player.inv = 60; player.boss = null; fireCd = 0;
}
function spawnEnemies() {
  const slots = [];
  for (let c = 3; c <= 6; c++) slots.push([c, 0, 2]);
  for (let c = 1; c <= 8; c++) slots.push([c, 1, 1]);
  for (let c = 1; c <= 8; c++) slots.push([c, 2, 1]);
  for (let c = 0; c <= 9; c++) slots.push([c, 3, 0]);
  for (let c = 0; c <= 9; c++) slots.push([c, 4, 0]);
  slots.forEach(([c, r, kind], i) => {
    const wave = Math.floor(i / 8), k = i % 8;
    enemies.push({
      c, r, kind, hp: kind === 2 ? 2 : 1, state: 'wait', delay: wave * 90 + k * 8 + 1,
      path: (challenge ? CHALLENGE_PATHS : ENTRY_PATHS)[wave], dist: 0, x: -50, y: -50, rot: 0,
      carry: false, beamOn: false, t: 0, fireAt: [], sgn: 1,
    });
  });
}

function addScore(n) {
  score += n;
  if (score > hi) hi = score;
  if (score >= nextExtra) { reserve++; nextExtra = nextExtra === 20000 ? 70000 : nextExtra + 70000; sfx.extra(); }
}
function saveHi() { try { localStorage.setItem('gs_hi', hi); } catch (e) {} }
function boom(x, y, size = 1, cols) { explosions.push({ x, y, t: 0, max: 22 * size, size, cols }); }
function popup(x, y, text, color = '#fff') { popups.push({ x, y, text, color, t: 50 }); }

// ================================================================ update
function update() {
  frame++;
  if (paused) return;
  for (const s of stars) { s.y += s.v * (st === 'title' ? 0.6 : 1); if (s.y > H) { s.y = 0; s.x = rnd() * W; } }
  if (st === 'title' || st === 'over') { explosions.forEach(e => e.t++); explosions = explosions.filter(e => e.t < e.max); return; }
  explosions.forEach(e => e.t++); explosions = explosions.filter(e => e.t < e.max);
  popups.forEach(p => p.t--); popups = popups.filter(p => p.t > 0);

  if (st === 'intro') { if (--timer <= 0) { spawnEnemies(); st = 'play'; } return; }
  if (st === 'clear') { if (--timer <= 0) { stage++; beginStage(); } return; }

  updatePlayer();
  updateEnemies();
  updateBullets();
  updateRescue();

  if (st === 'play' && enemies.length === 0) {
    beamStop();
    st = 'clear'; timer = challenge ? 200 : 90;
    if (challenge) {
      challengeBonus = challengeHits === 40 ? 10000 : challengeHits * 100;
      addScore(challengeBonus);
      if (challengeHits === 40) sfx.perfect();
    }
  }
}

function playerW() { return player.dual ? 27 : 13; }
function playerBounds() { return [6 + 7, W - 6 - 7 - (player.dual ? 14 : 0)]; }   // the dual fighter is wider, so its right-hand bound shifts in

function updatePlayer() {
  if (player.inv > 0) player.inv--;
  switch (player.state) {
    case 'ok': {
      if (slideX !== null) player.x = slideX;
      else {
        const l = keys['arrowleft'] || keys['a'], r = keys['arrowright'] || keys['d'];
        if (l) player.x -= 1.6;
        if (r) player.x += 1.6;
      }
      { const [pMin, pMax] = playerBounds(); player.x = Math.max(pMin, Math.min(pMax, player.x)); }
      syncSliderThumb();
      if (fireCd > 0) fireCd--;
      const want = firePressed || keys[' '];
      const cap = player.dual ? 4 : 2;
      if (want && fireCd <= 0 && pBullets.length < cap) {
        pBullets.push({ x: Math.round(player.x), y: PLAYER_Y - 8 });
        if (player.dual) pBullets.push({ x: Math.round(player.x) + 14, y: PLAYER_Y - 8 });
        fireCd = 9; sfx.shoot();
      }
      firePressed = false;
      break;
    }
    case 'dying':
      if (--player.t <= 0) afterLoss();
      break;
    case 'captured': {
      player.t++;
      const b = player.boss;
      if (b && b.dead) { player.boss = null; }
      const tx = b ? b.x : player.sx, ty = b ? b.y + 17 : player.sy - 30, k = Math.min(1, player.t / 90);
      player.cx = player.sx + (tx - player.sx) * k; player.cy = player.sy + (ty - player.sy) * k;
      if (player.t >= 100) {
        if (b && !b.dead) b.carry = true;
        afterLoss();
      }
      break;
    }
    case 'ready':
      if (--player.t <= 0) player.state = 'ok';
      break;
  }
}
function afterLoss() {
  beamStop();
  aBullets = [];
  if (reserve > 0) { reserve--; player.dual = false; resetPlayer(); player.state = 'ready'; player.t = 70; }
  else { st = 'over'; player.state = 'gone'; sfx.over(); saveHi(); }
}
function hitPlayer() {
  if (player.state !== 'ok' || player.inv > 0) return;
  if (player.dual) {
    player.dual = false; player.inv = 90;
    boom(player.x + 14, PLAYER_Y, 1); sfx.playerDie();
    return;
  }
  player.state = 'dying'; player.t = 100;
  boom(player.x, PLAYER_Y, 1.6);
  sfx.playerDie(); aBullets = [];
}

// ---------------------------------------------------------------- enemies
function startDive(e, beam) {
  const x0 = e.x, y0 = e.y, tx = Math.max(30, Math.min(W - 30, player.x));
  const sgn = e.sgn = x0 < W / 2 ? 1 : -1;
  if (beam) {
    const bx = Math.max(40, Math.min(W - 40, tx));
    e.path = buildPath([[x0, y0], [x0 + sgn * 26, y0 - 8], [x0 + sgn * 30, y0 + 30], [bx + sgn * 20, 110], [bx, 150]]);
    e.state = 'beamdive';
  } else {
    e.path = buildPath([[x0, y0], [x0 + sgn * 26, y0 - 8], [x0 + sgn * 34, y0 + 22], [x0 + sgn * 14, y0 + 52],
      [tx + sgn * 24, 140], [tx, 200], [tx - sgn * 26, 250], [tx - sgn * 30, 316]]);
    e.state = 'dive';
    e.fireAt = [e.path.len * (0.3 + rnd() * 0.1), e.path.len * (0.55 + rnd() * 0.1)];
  }
  e.dist = 0; sfx.dive();
}
const aliveInFormation = () => enemies.filter(e => e.state === 'form');
const diving = () => enemies.filter(e => ['dive', 'beamdive', 'beam'].includes(e.state)).length;

function enemyShoot(e) {
  const cap = 2 + Math.min(3, Math.floor(stage / 2));
  if (aBullets.length >= cap || player.state !== 'ok') return;
  const sp = Math.min(3.2, 1.7 + stage * 0.08);
  let dx = player.x - e.x, dy = PLAYER_Y - e.y;
  if (dy < 20) return;
  const d = Math.hypot(dx, dy);
  aBullets.push({ x: e.x, y: e.y + 6, vx: dx / d * sp, vy: dy / d * sp });
  sfx.enemyShot();
}

function updateEnemies() {
  let entering = false;
  for (const e of enemies) {
    switch (e.state) {
      case 'wait':
        entering = true;
        if (--e.delay <= 0) { e.state = 'enter'; e.dist = 0; const p = posAt(e.path, 0); e.x = p.x; e.y = p.y; }
        break;
      case 'enter': {
        entering = true;
        e.dist += 2.7;
        const p = posAt(e.path, e.dist);
        e.x = p.x; e.y = p.y; e.rot = p.ang - Math.PI / 2;
        if (!challenge && stage >= 2 && rnd() < 0.003) enemyShoot(e);
        if (e.dist >= e.path.len) {
          if (challenge) e.gone = true; else e.state = 'settle';
        }
        break;
      }
      case 'settle': {
        entering = true;
        const s = slotPos(e), dx = s.x - e.x, dy = s.y - e.y, d = Math.hypot(dx, dy), sp = 3.4;
        if (d <= sp) { e.x = s.x; e.y = s.y; e.rot = 0; e.state = 'form'; }
        else { e.x += dx / d * sp; e.y += dy / d * sp; e.rot = (Math.atan2(dy, dx) - Math.PI / 2) * Math.min(1, d / 26); }
        break;
      }
      case 'form': {
        const s = slotPos(e); e.x = s.x; e.y = s.y; e.rot = 0;
        break;
      }
      case 'dive': {
        e.dist += Math.min(3.4, 2.0 + stage * 0.1);
        const p = posAt(e.path, e.dist);
        e.x = p.x; e.y = p.y; e.rot = p.ang - Math.PI / 2;
        if (e.fireAt.length && e.dist >= e.fireAt[0]) { e.fireAt.shift(); enemyShoot(e); }
        if (e.dist >= e.path.len) { e.x = slotPos(e).x; e.y = -16; e.state = 'settle'; }
        if (player.state === 'ok' && player.inv <= 0 && Math.abs(e.x - (player.x + (player.dual ? 7 : 0))) < 8 + (player.dual ? 7 : 0) && Math.abs(e.y - PLAYER_Y) < 9) {
          killEnemy(e); hitPlayer();
        }
        break;
      }
      case 'beamdive': {
        e.dist += 2.6;
        const p = posAt(e.path, e.dist);
        e.x = p.x; e.y = p.y; e.rot = p.ang - Math.PI / 2;
        if (e.dist >= e.path.len) { e.state = 'beam'; e.t = 0; e.rot = 0; }
        break;
      }
      case 'beam': {
        e.t++;
        if (e.t === 20) { e.beamOn = true; beamStart(); }
        if (e.beamOn && player.state === 'ok' && player.inv <= 0) {
          const half = 20, px = player.x + (player.dual ? 7 : 0);
          if (Math.abs(px - e.x) < half + (player.dual ? 7 : 0)) {
            e.beamOn = false; beamStop();
            player.dual = false;
            player.state = 'captured'; player.t = 0; player.boss = e;
            player.sx = player.cx = player.x; player.sy = player.cy = PLAYER_Y;
            aBullets = []; sfx.capture();
            e.state = 'settle';
          }
        }
        if (e.t >= 180 && e.state === 'beam') {
          e.beamOn = false; beamStop();
          const sgn = e.x < W / 2 ? 1 : -1;
          e.path = buildPath([[e.x, e.y], [e.x + sgn * 24, e.y + 40], [e.x - sgn * 10, e.y + 100], [e.x, 316]]);
          e.dist = 0; e.fireAt = []; e.state = 'dive';
        }
        break;
      }
    }
    if (e.state === 'form' || e.state === 'enter' || e.state === 'settle') { /* nothing extra */ }
  }
  // enemies that flew off the screen in a challenge stage
  enemies = enemies.filter(e => !e.gone && !e.dead);

  // formation finished?
  if (!entryDone && !challenge && st === 'play' && !entering && enemies.length) { entryDone = true; }

  // attack dives
  if (!challenge && entryDone && player.state === 'ok' && st === 'play') {
    if (--diveTimer <= 0) {
      const form = aliveInFormation();
      const maxDivers = Math.min(6, 2 + Math.floor(stage / 3)) + (enemies.length < 10 ? 1 : 0);
      if (form.length && diving() < maxDivers) {
        const n = 1 + (stage > 4 ? 1 : 0) + (rnd() < 0.3 ? 1 : 0);
        for (let i = 0; i < n && form.length; i++) {
          const e = form.splice(rnd() * form.length | 0, 1)[0];
          const canBeam = e.kind === 2 && !e.carry && !player.dual && !rescue && !enemies.some(o => o.carry || o.state === 'beam' || o.state === 'beamdive')
                          && reserve >= 0 && rnd() < 0.5;
          startDive(e, canBeam);
        }
      }
      diveTimer = Math.max(30, 140 - stage * 8) * (0.6 + rnd() * 0.8) * (0.4 + 0.6 * enemies.length / 40);
    }
  }
}

function killEnemy(e, byBullet) {
  const diveKill = ['dive', 'beamdive', 'beam', 'enter'].includes(e.state);
  e.dead = true;
  if (challenge) { challengeHits++; addScore(100); popup(e.x, e.y, '100', '#ffe14d'); }
  else {
    const pts = diveKill && e.state !== 'enter' ? PTS_DIVE[e.kind] : PTS_FORM[e.kind];
    addScore(pts);
    if (pts >= 160) popup(e.x, e.y, String(pts), '#ffe14d');
  }
  if (e.beamOn) { e.beamOn = false; beamStop(); }
  if (e.kind === 2) { sfx.bossDie(); boom(e.x, e.y, 1.3); } else { sfx.hit(); boom(e.x, e.y, 1); }
  if (e.carry) {
    rescue = { x: e.x, y: e.y + 12, t: 0 };
    popup(e.x, e.y - 10, 'RESCUED SHIP', '#3fd8ff');
    e.carry = false;
  }
  if (player.boss === e) player.boss = null;
}

function updateBullets() {
  for (const b of pBullets) b.y -= 5.5;
  pBullets = pBullets.filter(b => b.y > TOP - 4);
  for (const b of pBullets) {
    for (const e of enemies) {
      if (e.dead || e.state === 'wait') continue;
      if (Math.abs(b.x - e.x) < 8 && b.y < e.y + 6 && b.y + 7 > e.y - 6) {
        b.y = -99;
        if (--e.hp > 0) { sfx.bossHit(); boom(e.x, e.y, 0.4); }
        else killEnemy(e, true);
        break;
      }
    }
  }
  pBullets = pBullets.filter(b => b.y > -50);

  for (const b of aBullets) { b.x += b.vx; b.y += b.vy; }
  aBullets = aBullets.filter(b => b.y < H && b.x > -5 && b.x < W + 5);
  if (player.state === 'ok' && player.inv <= 0) {
    for (let i = aBullets.length - 1; i >= 0; i--) {
      const b = aBullets[i], px0 = player.x - 6, px1 = player.x + (player.dual ? 20 : 6);
      if (b.x > px0 && b.x < px1 && b.y > PLAYER_Y - 6 && b.y < PLAYER_Y + 7) { aBullets.splice(i, 1); hitPlayer(); break; }
    }
  }
}

function updateRescue() {
  if (!rescue) return;
  rescue.t++; rescue.y += 1.8;
  const maxX = W - 6 - 7 - 14;                        // rightmost position that still leaves room for the second ship
  const dockX = Math.min(player.x, maxX) + 14;
  if (player.state === 'ok') rescue.x += (dockX - rescue.x) * 0.06;
  if (rescue.y >= PLAYER_Y) {
    if (player.state === 'ok' && Math.abs(rescue.x - dockX) < 14) {
      player.x = Math.min(player.x, maxX);
      player.dual = true; sfx.rescue(); popup(player.x + 7, PLAYER_Y - 16, 'DUAL FIGHTER', '#3fd8ff');
    }
    rescue = null;
  }
}

// ================================================================ render
function txt(s, x, y, color, size = 8, align = 'left') {
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.fillText(s, x, y);
}
const pad = (n, l = 6) => String(n).padStart(l, '0');
function spr(img, x, y, rot = 0) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  if (rot) ctx.rotate(rot);
  ctx.drawImage(img, -(img.width >> 1), -(img.height >> 1));
  ctx.restore();
}
function drawExplosion(e) {
  const k = e.t / e.max, r = (2 + k * 12) * e.size, n = 10;
  const cols = e.cols || ['#ffffff', '#ffe14d', '#ff9a1f', '#ff3b3b'];
  const col = cols[Math.min(cols.length - 1, Math.floor(k * cols.length))];
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + e.t * 0.05, rr = r * (0.6 + 0.4 * ((i * 7) % 3) / 2);
    ctx.fillRect(Math.round(e.x + Math.cos(a) * rr) - 1, Math.round(e.y + Math.sin(a) * rr) - 1, 2, 2);
  }
  if (k < 0.5) ctx.fillRect(Math.round(e.x) - 2, Math.round(e.y) - 2, 4, 4);
}
function drawBeam(e) {
  const y0 = e.y + 8, y1 = PLAYER_Y + 10, total = y1 - y0;
  for (let y = y0, i = 0; y < y1; y += 3, i++) {
    const k = (y - y0) / total, half = 4 + k * 17;
    ctx.fillStyle = ((i + (frame >> 1)) % 4 < 2) ? '#3fd8ff' : '#2a5cff';
    ctx.globalAlpha = 0.85;
    ctx.fillRect(Math.round(e.x - half), y, 2, 2);
    ctx.fillRect(Math.round(e.x + half - 2), y, 2, 2);
    ctx.globalAlpha = 0.35;
    ctx.fillRect(Math.round(e.x - half + 2), y, Math.round(half * 2 - 4), 2);
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of stars) {
    if (((frame >> 3) + (s.x | 0)) % 7 === 0) continue;   // twinkle
    ctx.fillStyle = s.c; ctx.fillRect(s.x | 0, s.y | 0, 1, s.v > 1 ? 2 : 1);
  }

  // HUD
  txt('1UP', 8, 10, '#ff4d4d');
  txt(pad(score), 8, 21, '#fff');
  txt('HIGH SCORE', W / 2, 10, '#ff4d4d', 8, 'center');
  txt(pad(hi), W / 2, 21, '#fff', 8, 'center');

  if (st === 'title') return renderTitle();

  const fr = (frame >> 5) & 1;

  // beams under everything else
  for (const e of enemies) if (e.beamOn) drawBeam(e);

  // enemies
  for (const e of enemies) {
    if (e.state === 'wait') continue;
    const set = e.kind === 2 ? (e.hp > 1 ? IMG.boss : IMG.bossHurt) : KIND_IMG[e.kind];
    const f = (e.state === 'form' ? fr : (frame >> 3) & 1);
    spr(set[f], e.x, e.y, e.rot);
    if (e.carry) spr(IMG.shipRed, e.x, e.y - 15);
  }

  // player
  const blink = player.inv > 0 && (frame >> 2) & 1;
  if (player.state === 'ok' || player.state === 'ready') {
    if (!blink) { spr(IMG.ship, player.x, PLAYER_Y); if (player.dual) spr(IMG.ship, player.x + 14, PLAYER_Y); }
  } else if (player.state === 'captured') {
    spr(IMG.ship, player.cx, player.cy, player.t * 0.35);
  }
  if (rescue) spr(IMG.ship, rescue.x, rescue.y, rescue.t * 0.3);

  // bullets
  ctx.fillStyle = '#ffe14d';
  for (const b of pBullets) { ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y), 2, 7); }
  ctx.fillStyle = '#ffffff';
  for (const b of pBullets) { ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y), 2, 2); }
  for (const b of aBullets) {
    ctx.fillStyle = '#ff5c3d'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 2, 3, 5);
    ctx.fillStyle = '#ffe14d'; ctx.fillRect(Math.round(b.x), Math.round(b.y) - 1, 1, 3);
  }

  for (const e of explosions) drawExplosion(e);
  for (const p of popups) txt(p.text, p.x, p.y - (50 - p.t) * 0.2, p.color, 7, 'center');

  // bottom bar
  for (let i = 0; i < reserve; i++) spr(IMG.ship, 12 + i * 15, 276);
  txt('STAGE ' + stage, W - 8, 281, '#3fd8ff', 8, 'right');

  // overlays
  if (st === 'intro') {
    if (challenge) { txt('CHALLENGING', W / 2, 140, '#ffe14d', 12, 'center'); txt('STAGE', W / 2, 156, '#ffe14d', 12, 'center'); }
    else txt('STAGE ' + stage, W / 2, 150, '#3fd8ff', 12, 'center');
  }
  if (st === 'clear' && challenge) {
    txt('NUMBER OF HITS  ' + challengeHits, W / 2, 130, '#fff', 8, 'center');
    if (challengeHits === 40) txt('PERFECT!', W / 2, 150, '#ff4d4d', 12, 'center');
    txt('BONUS  ' + challengeBonus, W / 2, 170, '#ffe14d', 10, 'center');
  }
  if (player.state === 'ready' && st === 'play') txt('READY', W / 2, 150, '#3fd8ff', 12, 'center');
  if (paused) txt('PAUSED', W / 2, 150, '#fff', 14, 'center');
  if (st === 'over') {
    txt('GAME OVER', W / 2, 140, '#ff4d4d', 16, 'center');
    if (frame % 60 < 40) txt(TOUCH ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', W / 2, 165, '#fff', 8, 'center');
  }
  if (muted) txt('MUTED', 8, 281, '#888', 8);
}

function renderTitle() {
  txt('GALACTIC', W / 2, 82, '#3fd8ff', 24, 'center');
  txt('SWARM', W / 2, 108, '#ff4d4d', 24, 'center');
  const f = (frame >> 5) & 1;
  spr(IMG.boss[f], 70, 142);  txt('= 150 / 400', 88, 146, '#fff');
  spr(IMG.moth[f], 70, 162);  txt('=  80 / 160', 88, 166, '#fff');
  spr(IMG.bee[f], 70, 182);   txt('=  50 / 100', 88, 186, '#fff');
  txt('SHOOT THE COMMANDER TO SAVE', W / 2, 208, '#aaa', 7, 'center');
  txt('A CAPTURED SHIP AND FLY DUAL', W / 2, 218, '#aaa', 7, 'center');
  if (frame % 60 < 40) txt(TOUCH ? 'TAP TO START' : 'PRESS ENTER OR SPACE TO START', W / 2, 242, '#ffe14d', 8, 'center');
  if (!TOUCH) {
    txt('ARROWS / A D  MOVE     SPACE  FIRE', W / 2, 262, '#888', 7, 'center');
    txt('P  PAUSE     M  MUTE', W / 2, 272, '#888', 7, 'center');
  }
}

// ================================================================ touch controls
function hold(id, key, onDown) {
  const el = document.getElementById(id);
  const set = v => { keys[key] = v; el.classList.toggle('on', v); };
  el.addEventListener('pointerdown', e => { e.preventDefault(); el.setPointerCapture(e.pointerId); set(true); initAudio(); if (onDown) onDown(); });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(t, () => set(false));
  el.addEventListener('contextmenu', e => e.preventDefault());
}
hold('fire', ' ', pressFire);   // holding FIRE auto-fires
// Left/right is a touch slider spanning the old two-button width: dragging anywhere across it sets the ship's x position
// directly and proportionally (not a relative drag), so the thumb is always exactly where the ship is.
let slideX = null;
function setupSlider() {
  const track = document.getElementById('slide');
  const apply = e => {
    const [pMin, pMax] = playerBounds(), rect = track.getBoundingClientRect(), frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    slideX = pMin + frac * (pMax - pMin);
  };
  track.addEventListener('pointerdown', e => { e.preventDefault(); track.setPointerCapture(e.pointerId); initAudio(); apply(e); });
  track.addEventListener('pointermove', e => { if (slideX !== null) apply(e); });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) track.addEventListener(t, () => { slideX = null; });
  track.addEventListener('contextmenu', e => e.preventDefault());
}
function syncSliderThumb() {
  const thumb = document.getElementById('slideThumb'), track = document.getElementById('slide');
  const [pMin, pMax] = playerBounds(), travel = track.clientWidth - 8 - thumb.clientWidth;
  const frac = (player.x - pMin) / (pMax - pMin);
  thumb.style.left = (4 + frac * travel) + 'px';
}
setupSlider();
for (const [id, fn] of [['bp', togglePause], ['bm', toggleMute]])
  document.getElementById(id).addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); fn(); });
cv.addEventListener('pointerdown', () => { initAudio(); if (st === 'title' || st === 'over') startGame(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if ((st === 'play' || st === 'intro') && !paused) togglePause(); else beamStop(); }
});
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ================================================================ main loop
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
